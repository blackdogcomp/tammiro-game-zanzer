<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: gamebook page on the right (RTL), character sheet as a narrow ledger on the left; stacks on phones */
:root{
  --bg:#efe9eb; --surface:#fbf8f9; --sunk:#e6dee1; --ink:#231b21; --muted:#6c5f68; --line:#d8ccd1;
  --salt:#b3261e; --frost:#22708a; --danger:#a3271d; --good:#2e6a3a;
  --f-display:"Suez One","David Libre",serif;
  --f-body:"David Libre","David",Georgia,serif;
  --f-ui:"Assistant","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141117; --surface:#1d1921; --sunk:#26212b; --ink:#ece4e8; --muted:#a2959e; --line:#372f3a;
  --salt:#e5483b; --frost:#7cc3d6; --danger:#ee6a5e; --good:#80c48f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141117; --surface:#1d1921; --sunk:#26212b; --ink:#ece4e8; --muted:#a2959e; --line:#372f3a;
  --salt:#e5483b; --frost:#7cc3d6; --danger:#ee6a5e; --good:#80c48f; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{direction:rtl}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--salt);letter-spacing:.02em}
.chips{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
.chip.hp b{color:var(--danger)} .chip.lk b{color:var(--frost)}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);gap:20px}}
.page{min-width:0}
.secno{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--salt);font-variant-numeric:tabular-nums}
.sechead{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.sechead h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.prose{font-family:var(--f-body);font-size:20px;line-height:1.7;max-width:62ch}
.prose p{margin:0 0 .9em}
.prose q,.prose .rune{font-style:normal}
.rune{display:block;margin:.2em 0 1em;padding:10px 14px;background:var(--sunk);border-radius:4px;font-weight:500}
.msgs{display:flex;flex-direction:column;gap:4px;margin:4px 0 18px;max-width:62ch}
.msg{font-size:14px;color:var(--muted);padding-inline-start:14px;position:relative}
.msg::before{content:"◆";position:absolute;inset-inline-start:0;font-size:9px;top:5px;color:var(--salt)}
.msg.bad::before{color:var(--danger)} .msg.ok::before{color:var(--good)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:62ch;margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 16px;font-family:var(--f-body);font-size:17px;line-height:1.4;transition:border-color .15s,transform .15s}
.choice:hover{border-color:var(--salt)} .choice:active{transform:translateY(1px)}
.choice:focus-visible,.btn:focus-visible,.cls:focus-visible,input:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
.go{font-family:var(--f-ui);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.go.chk{color:var(--frost)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;max-width:62ch;margin:6px 0 14px}
.plabel{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--frost);margin-bottom:8px}
.plabel.red{color:var(--danger)}
.roll{font-variant-numeric:tabular-nums;font-size:15px;line-height:1.6}
.res{font-weight:700} .res.ok{color:var(--good)} .res.bad{color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 14px;font-size:15px;font-weight:600}
.btn:hover{border-color:var(--salt)}
.btn.main{background:var(--salt);border-color:var(--salt);color:var(--surface)}
.btn.luck{border-color:var(--frost);color:var(--frost)}
.btn:disabled{opacity:.45;cursor:default}
.foes{display:flex;flex-direction:column;gap:6px}
.foe{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:4px;font-variant-numeric:tabular-nums}
.foe .nm{font-weight:700} .foe .sub{font-size:13px;color:var(--muted)}
.foe.out{opacity:.5} .foe.out .nm{text-decoration:line-through}
.bar{height:6px;width:90px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--danger)}
.clog{margin-top:12px;font-size:14px;line-height:1.55;max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.clog div{padding:1px 0}
.clog .h{color:var(--salt);font-weight:700;margin-top:4px}
/* sheet */
.sheet{min-width:0;font-size:14px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:820px){.sheet{position:static}}
.sheet h2{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:0;color:var(--ink)}
.sheet .who{color:var(--muted);margin:2px 0 12px}
.sblock{border-top:1px solid var(--line);padding-block:10px}
.slabel{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 6px;text-align:center;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted)} .stat .v{font-size:20px;font-weight:700;line-height:1.1} .stat .m{font-size:11px;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vit{text-align:center;padding:6px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.vit .v{font-size:22px;font-weight:700;line-height:1.1}.vit .k{font-size:11px;color:var(--muted)}
.vit.hp .v{color:var(--danger)} .vit.lk .v{color:var(--frost)}
.rows{display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:8px}
.row span:last-child{font-weight:600}
.inv{display:flex;flex-direction:column;gap:4px}
.inv .row{align-items:center}
.mini{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.mini:hover{border-color:var(--salt)}
.dlog{font-size:12.5px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
/* creation */
.intro{font-family:var(--f-body);font-size:19px;line-height:1.7;max-width:62ch}
.hero{font-family:var(--f-display);font-size:min(72px,16vw);line-height:1.05;color:var(--salt);margin:6px 0 4px}
.tag{font-size:14px;color:var(--muted);letter-spacing:.04em;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
input[type=text]{font:inherit;font-size:17px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:320px;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:62ch}
@media (max-width:560px){.classes{grid-template-columns:minmax(0,1fr)}}
.cls{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cls .n{font-family:var(--f-display);font-size:22px;line-height:1.1}
.cls .d{font-size:13px;color:var(--muted);line-height:1.4}
.cls[aria-pressed="true"],.btn[aria-pressed="true"]{border-color:var(--salt);box-shadow:0 0 0 1px var(--salt) inset}
.endmark{font-family:var(--f-display);font-size:34px;line-height:1.2;margin:10px 0}
.endmark.dead{color:var(--danger)} .endmark.win{color:var(--good)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
"use strict";
/* ---------- dice ---------- */
const R=s=>1+Math.floor(Math.random()*s);
function dice(n,s,p=0){let t=0;const r=[];for(let i=0;i<n;i++){const v=R(s);r.push(v);t+=v}return{t:t+p,r}}
const DN=(n,s,p=0)=>(n>1?n:'')+'ק'+s+(p?' ועוד '+p:'');
const mod=v=>v<=3?-3:v<=5?-2:v<=8?-1:v<=12?0:v<=15?1:v<=17?2:3;
const sg=v=>'<span dir="ltr" style="unicode-bidi:isolate">'+(v>0?'+'+v:v<0?'−'+(-v):'0')+'</span>';

/* ---------- rules data (סכנות ומפלצות 1.4) ---------- */
const AB={str:'כוח',int:'תבונה',wis:'חוכמה',dex:'זריזות',con:'חוסן',cha:'כריזמה'};
const ABK=['str','int','wis','dex','con','cha'];
const SV={death:'מוות או רעל',wand:'שרביט קסם',para:'שיתוק או התאבנות',breath:'נשיפת דרקון',spell:'מוט, מטה או לחש'};
const SK={climb:'טיפוס',hide:'הסתתרות בצללים',silent:'תנועה שקטה',locks:'פתיחת מנעולים',traps:'גילוי מלכודות',hear:'הקשבה'};
const TS={locks:45,traps:40,climb:87,silent:50,hide:40,hear:50}; // רמה 1 כולל בונוס
const TSB={locks:15,traps:10,climb:87,silent:20,hide:10,hear:30};
const CL={
 fighter:{n:'לוחם',nf:'לוחמת',hd:8,pr:'str',sv:{death:12,wand:13,para:14,breath:15,spell:16},
   w:{n:'חרב ארוכה',d:[1,8]},arm:{n:'שריון שרשראות',ac:14},shield:true,inv:{torch:1},
   kit:'חרב ארוכה, שריון שרשראות, מגן ולפיד',
   desc:'מומחה לקרב. ק8 נק"פ, שריון שרשראות ומגן, חרב ארוכה.'},
 mu:{n:'קוסם',nf:'קוסמת',hd:4,pr:'int',sv:{death:13,wand:14,para:13,breath:16,spell:15},
   w:{n:'פגיון',d:[1,4]},arm:null,shield:false,inv:{book:1,lantern:1},
   kit:'פגיון, עששית וספר לחשים כרוך בעור, ובו שני לחשים בכתב ידך',
   desc:'חלש בקרב, ק4 נק"פ. יודע שני לחשים: שינה וקליע קסם.'},
 thief:{n:'גנב',nf:'גנבת',hd:4,pr:'dex',sv:{death:13,wand:14,para:13,breath:16,spell:15},
   w:{n:'חרב קצרה',d:[1,6]},arm:{n:'שריון עור',ac:12},shield:false,inv:{rope:1,tools:1},
   kit:'חרב קצרה, שריון עור, חבל באורך 15 מטרים וכלי גנב',
   desc:'ק4 נק"פ. מטפס, מתגנב, מסתתר ופותח מנעולים. דקירה בגב בהפתעה.'}
};
const IT={spike:'יתד ברזל',rope:'חבל, 15 מ׳',tools:'כלי גנב',book:'ספר לחשים',torch:'לפיד',lantern:'עששית',
 potion:'שיקוי ריפוי',glow:'בלוטות זוהרות',flash:'אבקת הבזק',key:'מפתח הגשר',map:'מפה גסה',ring:'טבעת הגנה ועוד 1',treasure:'אבני חן ותכשיט (כ־900 מ"ז)'};

const ORC=(hp=5)=>({n:'אורק',hp,ac:13,ab:0,dmg:[1,6],ml:8,hd:1,xp:100});
const BEETLE=()=>({n:'חיפושית אש ענקית',hp:7,ac:15,ab:1,dmg:[2,4],ml:7,hd:1.5,xp:150});
const CENTI=()=>({n:'נדל ענק',hp:2,ac:10,ab:-1,dmg:[1,2],ml:7,hd:.5,xp:50,poison:true});
const SKEL=()=>({n:'שלד גמד',hp:5,ac:12,ab:0,dmg:[1,6],ml:12,hd:1,xp:100,undead:true});
const SPIDER=()=>({n:'עכביש מערות ענק',hp:9,ac:12,ab:1,dmg:[1,6],ml:8,hd:2,xp:250,poison:true});
const SERGEANT=()=>({n:'סמל אורקים',hp:9,ac:14,ab:1,dmg:[1,8],ml:9,hd:2,xp:200});
const ZANZAR=()=>({id:'z',n:'זאנזר',hp:9,ac:11,ab:0,dmg:[1,4],ml:7,hd:3,xp:350,missile:true});

/* ---------- state ---------- */
let st=null, cr=null, ACTS=[];
const KEY='salt-prisoner-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}

const has=k=>(st.inv[k]||0)>0;
const add=(k,n=1)=>{st.inv[k]=(st.inv[k]||0)+n};
const M=a=>mod(st.st[a]);
const C=()=>CL[st.cls];
function AC(){let a=10;if(st.kit){const c=C();if(c.arm)a=c.arm.ac;if(c.shield)a+=1}a+=M('dex');if(has('ring'))a+=1;return a}
function WEAP(){if(st.kit)return C().w;if(has('spike'))return{n:'יתד ברזל',d:[1,4]};return{n:'אגרופים',d:[1,2]}}
function G(s){if(!s)return'';return s.replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,b)=>st&&st.g==='f'?b:a).replace(/\[NAME\]/g,esc(st?st.name:''))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dlog(t){st.dl.unshift(t);st.dl=st.dl.slice(0,10)}
function msg(t,c=''){st.msgs.push({t,c})}
function hurt(n,why){st.hp-=n;msg(`${why||'נפגעת'}: ${n} נק"פ`,'bad');if(st.hp<=0){st.hp=0;st.dying={end:S[st.cur].death||'d_generic'}}}
function heal(n,why){const b=st.hp;st.hp=Math.min(st.max,st.hp+n);msg(`${why}: ${st.hp-b} נק"פ`,'ok')}

/* ---------- sections ---------- */
const S={
s1:{t:'תא המלח',x:`{אתה מתעורר|את מתעוררת} על רצפה קרה ומחוספסת. טעם מלוח עולה על {שפתיך|שפתייך}, והראש הולם כאילו מישהו הלם בו בפטיש. הקירות סביבך שוברים את האור הקלוש לניצוצות ורודים ולבנים. מלח. תא שלם חצוב בתוך גוש של מלח.

{אתה מנסה|את מנסה} להיזכר איך הגעת לכאן, ושום דבר לא עולה. לא מקום, לא פנים, אפילו לא שמך. {אתה לבוש|את לבושה} בכותונת פשוטה, {יחף|יחפה}, בלי שום חפץ.

מתחת לדלת עץ כבדה, מחוזקת בפסי ברזל, מסתנן פס של אור לפיד. על הקיר שמול הדלת {אתה מבחין|את מבחינה} בסימנים חרוטים, קבורים למחצה תחת קרום של מלח.`,
 ch:[{t:'לבחון את הסימנים שעל הקיר',go:'s2'},
     {t:'להצמיד אוזן לדלת ולהקשיב',chk:{k:'skill',s:'hear',alt:{k:'d6',n:2}},ok:'s1h',fail:'s3'},
     {t:'להלום על הדלת ולצעוק',go:'s3'}]},
s1h:{t:'מאחורי הדלת',x:`{אתה מצמיד|את מצמידה} אוזן לעץ הקר. מהצד השני נשמעות נשימות כבדות, צקצוק של לעיסה ומלמול גרוני בשפה גסה. משום מה {אתה מבין|את מבינה} חלק מהמילים: «...הקוסם אמר לא לגעת... עד הירח החדש... משעמם...»

שומר אחד. רק אחד. ומדי פעם הוא בא להציץ.`,
 ch:[{t:'לחפש בתא משהו שישמש נשק',go:'s2'},{t:'להיצמד לקיר ליד הדלת ולחכות לו',go:'s4'},{t:'לקרוא לו',go:'s3'}]},
s2:{t:'הרונות',on(){if(!has('spike')){add('spike');msg('נמצאה יתד ברזל: נשק מאולתר, ק4','ok')}},
 x:`{אתה מגרד|את מגרדת} את קרום המלח באצבעות. מתחתיו נחשפות רונות זוויתיות, גמדיות. ואז קורה דבר מוזר: {אתה מבין|את מבינה} אותן. {אינך יודע|אינך יודעת} מאין, אבל המילים עולות מעצמן:
<span class="rune">«אל תעירו את הישן תחת האולם הגדול. הכפור הוא נשימתו.»</span>
כשאצבעותיך עוברות על הקיר, אחת האבנים זזה תחתן. מאחוריה גומחה קטנה, ובה יתד ברזל חלודה, ארוכה כמו פגיון. מישהו החביא אותה כאן, אולי אסיר שישב בתא הזה לפניך.`,
 ch:[{t:'להיצמד לקיר ליד הדלת, היתד ביד, ולחכות לשומר',go:'s4'},{t:'להלום על הדלת ולקרוא לשומר',go:'s3'}]},
s3:{t:'השומר',x:`בריח כבד נגרר, והדלת נפתחת בחריקה. בפתח ניצב אורק: גבוה ממך בראש, עורו אפור־ירקרק, וניבים צהובים בולטים מלסתו התחתונה. בידו האחת לפיד ובשנייה אלה.

«הקוסם אמר {שתשתוק|שתשתקי},» הוא נוהם. «הקוסם לא אמר שאסור להרביץ.»`,

/* ---------- navigation ---------- */
function go(id){st.cur=id;st.ent=false;st.chk=null;st.cmb=null;st.dying=null;render();try{document.querySelector('.page').scrollIntoView({block:'start'})}catch(e){window.scrollTo(0,0)}}

function runChk(c){

 if(c.k==='abil'){const t=st.st[c.a]+(c.m||0),r=R(20);dlog(`${AB[c.a]}: ק20 = ${r} (צריך ${t} או פחות)`);return{txt:`בדיקת ${AB[c.a]}: ק20, צריך ${t} או פחות`,r,ok:r<=t}}

 if(c.k==='d6'){const r=R(6);dlog(`ק6 = ${r} (הצלחה ב־1 עד ${c.n})`);return{txt:`ק6, הצלחה ב־1 עד ${c.n}`,r,ok:r<=c.n}}
}

/* ---------- combat ---------- */
function initC(d){return{en:d.en.map(e=>({...e,cur:e.hp,st:'ok'})),sur:!!d.surprise,mc:false,lg:[],over:false,miss:null,rd:0}}
const alive=c=>c.en.filter(e=>e.st==='ok');

function pAtk(c,bs){

 c.miss=null;let d=Math.max(1,dmgRoll(w.d,sm).t);if(bs)d*=2;e.cur-=d;

 morale(c)}

function eTurn(c,fleeing){
 for(const e of alive(c)){if(st.dying)return;
  if(e.missile&&!e.used){e.used=true;const d=dmgRoll([1,6],1).t;L(c,`${e.n} משגר קליע קסם: ${d} נק"פ.`,'bad');dmgP(d);continue}
  const r=R(20),ab=e.ab+(fleeing?2:0),tot=r+ab,hit=r===20||(r!==1&&tot>=AC());

  const d=Math.max(1,dmgRoll(e.dmg).t);L(c,`ה${e.n} פוגע: ${d} נק"פ.`,'bad');dmgP(d);

   if(sr<t){const x=dmgRoll([1,4]).t;L(c,`ארס! ההצלה נכשלה (${sr}): עוד ${x} נק"פ.`,'bad');dmgP(x)}else L(c,`${G('{הדפת|הדפת}')} את הארס (${sr}).`)}
 }}
function dmgP(d){st.hp-=d;if(st.hp<=0){st.hp=0;st.dying={end:S[st.cur].death||'d_generic'}}}
function endChk(c){if(!alive(c).length){c.over=true}}
function round(){
 const c=st.cmb;if(c.over||st.dying)return;c.rd++;c.miss=null;L(c,`סבב ${c.rd}`,'h');
 if(c.sur){c.sur=false;L(c,'סבב הפתעה: האויב אינו מגיב.');pAtk(c,st.cls==='thief');endChk(c);fin();return}
 const pi=R(6),ei=R(6);dlog(`יוזמה: ${pi} מול ${ei}`);L(c,`יוזמה: ${pi} מול ${ei}.`);
 if(pi>=ei){pAtk(c,false);endChk(c);if(!c.over)eTurn(c)}else{eTurn(c);if(!st.dying){pAtk(c,false);endChk(c)}}
 fin()}
function luckRe(){const c=st.cmb;if(!c.miss||st.luck<1)return;st.luck--;L(c,'נקודת מזל: גלגול חוזר.','h');const bs=c.miss.bs;c.miss=null;pAtk(c,bs);endChk(c);fin()}
function cast(sp){
 const c=st.cmb;c.rd++;c.miss=null;st.sp[sp]--;L(c,`סבב ${c.rd}`,'h');const s=c.sur;c.sur=false;
 if(sp==='missile'){const e=alive(c)[0],d=dmgRoll([1,6],1).t;e.cur-=d;dlog(`קליע קסם: ${d}`);L(c,`קליע קסם פוגע ב${e.n}: ${d} נק"פ.`,'ok');
  if(e.cur<=0){e.cur=0;e.st='dead';st.xp+=e.xp;L(c,`ה${e.n} נופל.`,'ok')}morale(c)}
 else{let cap=dice(2,8).t;dlog(`שינה: 2ק8 = ${cap} קב"פ`);L(c,`לחש שינה: ${cap} קב"פ של יצורים.`);
  for(const e of alive(c)){if(e.hd<=cap){cap-=e.hd;e.st='sleep';st.xp+=e.xp;L(c,`ה${e.n} צונח ונרדם.`,'ok')}}}
 endChk(c);if(!c.over&&!s)eTurn(c);fin()}
function flee(){const c=st.cmb;L(c,'בריחה! האויב מקבל תקיפה חופשית.','h');eTurn(c,true);if(!st.dying){go(S[st.cur].cb.flee);return}fin()}
function fin(){save();render()}

/* ---------- character creation ---------- */
const KEYST={fighter:['str','con'],mu:['int','con'],thief:['dex','wis']};
function newCr(){const c={name:'ארין',g:'m',cls:'fighter',rolls:{}};for(const k in CL)c.rolls[k]=rollStats(k);saveCr(c);return c}
function rollStats(cls){const o={};ABK.forEach(k=>o[k]=dice(3,6).t);for(const k of KEYST[cls])while(o[k]<13)o[k]=dice(3,6).t;return o}
function saveCr(c){try{localStorage.setItem(KEY+'-cr',JSON.stringify(c))}catch(e){}}
function loadCr(){try{const c=JSON.parse(localStorage.getItem(KEY+'-cr'));return c&&c.rolls&&c.rolls.fighter?c:null}catch(e){return null}}
function startGame(){
 const c=CL[cr.cls],cs=cr.st||cr.rolls[cr.cls],hp=Math.max(1,c.hd+mod(cs.con));
 st={name:(cr.name||'').trim()||'ארין',g:cr.g,cls:cr.cls,st:cs,max:hp,hp,luck:3+Math.max(0,mod(cs.cha)),
  inv:{},kit:false,gold:0,xp:0,sp:cr.cls==='mu'?{sleep:1,missile:1}:{},rested:false,dfail:0,fl:{},dl:[],msgs:[],cur:'s1',ent:false};
 dlog('המשחק התחיל');go('s1')}

/* ---------- render ---------- */
function B(label,fn,cls='btn',attrs=''){ACTS.push(fn);return`<button class="${cls}" data-a="${ACTS.length-1}" ${attrs}>${label}</button>`}
function paras(t){t=t.replace(/\n?(<span class="rune">)/g,'$1').replace(/(<\/span>)\n?/g,'$1');return t.split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
function render(){ACTS=[];const app=document.getElementById('app');
 if(!st){app.innerHTML=topBar()+`<div class="wrap"><main class="page">${creation()}</main><aside class="sheet">${crSheet()}</aside></div>`;return}
 enter();app.innerHTML=topBar()+`<div class="wrap"><main class="page">${page()}</main><aside class="sheet">${sheet()}</aside></div>`}
function topBar(){
 const chips=st?`<span class="chip hp">נק"פ <b>${st.hp}/${st.max}</b></span><span class="chip">ד"ש <b>${AC()}</b></span><span class="chip">§ <b>${NUM[st.cur]}</b></span>`:'';
 return`<header class="top"><div class="top-in"><div class="brand">אסיר המלח</div><div class="chips">${chips}</div></div></header>`}
function creation(){
 const c=CL[cr.cls],cs=cr.rolls[cr.cls],hp=Math.max(1,c.hd+mod(cs.con));
 return`<div class="hero">אסיר המלח</div><div class="tag">הרפתקת יחיד לסכנות ומפלצות 1.4 · רמה 1 · כ־35 קטעים</div>
 <div class="intro"><p>זאנזר הקוסם חטף אותך והשליך אותך למכרה מלח עתיק, שהיה פעם מבצר גמדי. הגמדים נטשו אותו בפחד מסיבה שנשכחה בערפילי הזמן. ${cr.g==='f'?'אינך זוכרת':'אינך זוכר'} דבר. לא את העולם שבחוץ, ולא את ההיסטוריה שלך.</p></div>
 <div class="field"><label for="nm">שם הדמות (יתגלה בהמשך)</label><input type="text" id="nm" value="${esc(cr.name)}" maxlength="24"></div>
 <div class="field"><label>מין</label><div class="seg">${B('גבר',()=>{cr.g='m';saveCr(cr);render()},'btn',`aria-pressed="${cr.g==='m'}"`)}${B('אישה',()=>{cr.g='f';saveCr(cr);render()},'btn',`aria-pressed="${cr.g==='f'}"`)}</div></div>
 <div class="field"><label>מקצוע</label><div class="classes">${Object.keys(CL).map(k=>B(`<span class="n">${cr.g==='f'?CL[k].nf:CL[k].n}</span><span class="d">${CL[k].desc}</span>`,()=>{cr.cls=k;saveCr(cr);render()},'cls',`aria-pressed="${cr.cls===k}"`)).join('')}</div></div>
 <div class="field"><label>תכונות (3ק6 לפי הסדר)</label><div class="stats" style="max-width:420px">${ABK.map(k=>`<div class="stat"><div class="k">${AB[k]}${KEYST[cr.cls].includes(k)?' ★':''}</div><div class="v">${cs[k]}</div><div class="m">${sg(mod(cs[k]))}</div></div>`).join('')}</div></div>
 <p class="note">נק"פ התחלתיות: ${hp} (מרבי לפי כללי משחק יחיד). ★ תכונות המפתח של המקצוע: תמיד 13 ומעלה. התכונות נקבעות פעם אחת ואין גלגול מחדש.</p>
 <div class="btns">${B('להתחיל',()=>{const i=document.getElementById('nm');if(i)cr.name=i.value;startGame()},'btn main')}</div>`}
function crSheet(){return`<div class="slabel">איך משחקים</div><div class="rows note" style="gap:8px;line-height:1.5">
 <div>כל קטע מסתיים בבחירות. חלקן דורשות בדיקה: הקוביות מגולגלות אוטומטית ומוצגות ביומן.</div>
 <div>ב־0 נק"פ ${'הדמות'} על סף המוות: הצלה מפני מוות מחזירה אותה עם נק"פ אחת. הכישלון השלישי במשחק הוא הסוף.</div>
 <div>מנוחה קצרה אחת: ק4 נק"פ.</div>
 <div>לגנב בונוס של משחק יחיד לכישורים.</div>
 <div>ההתקדמות נשמרת בדפדפן הזה.</div></div>`}
function page(){
 const s=S[st.cur];let h=`<div class="sechead"><div class="secno">${NUM[st.cur]}</div><h1>${G(s.t)}</h1></div>`;
 const x=typeof s.x==='function'?s.x():s.x;h+=`<div class="prose">${paras(G(x))}</div>`;
 if(st.msgs.length)h+=`<div class="msgs">${st.msgs.map(m=>`<div class="msg ${m.c}">${G(m.t)}</div>`).join('')}</div>`;
 if(st.dying)return h+deathPanel();
 if(s.end)return h+endPanel(s);
 if(st.cmb)return h+combatPanel(s);
 if(st.chk)return h+chkPanel();
 const ch=(s.ch||[]).filter(c=>!c.if||c.if());
 h+=`<div class="choices">${ch.map(c=>B(`<span>${G(c.t)}</span><span class="go ${c.chk?'chk':''}">${c.chk?'בדיקה: '+chkLabel(c.chk):'עבור ל־'+NUM[c.go]}</span>`,()=>choose(c),'choice')).join('')}</div>`;
 return h}
function chkPanel(){const k=st.chk,r=k.res;
 let h=`<div class="panel"><div class="plabel">בדיקה</div><div class="roll">${G(r.txt)}<br>יצא <b>${r.r}</b>: <span class="res ${r.ok?'ok':'bad'}">${r.ok?'הצלחה':'כישלון'}</span></div><div class="btns">`;
 h+=B(`להמשיך ← ${NUM[r.ok?k.ok:k.fail]}`,()=>go(r.ok?k.ok:k.fail),'btn main');return h+`</div></div>`}
function deathPanel(){const d=st.dying,t=C().sv.death;
 let h=`<div class="panel"><div class="plabel red">על סף המוות</div><div class="roll">${G('{אתה מאבד|את מאבדת}')} את ההכרה. הצלה מפני מוות: ק20, צריך ${t} או יותר. כישלונות במשחק: ${st.dfail} מתוך 3.</div>`;
 if(d.res)h+=`<div class="roll">יצא <b>${d.res.r}</b>: <span class="res ${d.res.ok?'ok':'bad'}">${d.res.ok?G('{נאחזת|נאחזת} בחיים'):'כישלון'}</span></div>`;
 h+='<div class="btns">';
 if(d.res&&d.res.ok)h+=B('להתעשת (נק"פ אחת)',()=>{st.hp=1;st.dying=null;save();render()},'btn main');
 else if(st.dfail>=3)h+=`<div class="endmark dead">${G(S[d.end].t)}</div><div class="prose">${paras(G(S[d.end].x))}</div>`+B('להתחיל מחדש',()=>{clearSave();st=null;cr=newCr();render();window.scrollTo(0,0)},'btn main');
 else{h+=B(d.res?'להמשיך להיאבק':'לגלגל הצלה',()=>deathRoll(false),'btn main')}
 return h+'</div></div>'}
function combatPanel(s){const c=st.cmb,w=WEAP();
 let h=`<div class="panel"><div class="plabel red">קרב${c.sur?' · הפתעה':''}</div><div class="foes">${c.en.map(e=>`<div class="foe ${e.st!=='ok'?'out':''}"><div><div class="nm">${e.n}</div><div class="sub">ד"ש ${e.ac} · ${e.st==='dead'?'מת':e.st==='fled'?'נס':e.st==='sleep'?'ישן':'נק"פ '+e.cur+'/'+e.hp}</div></div><div class="bar"><i style="width:${Math.round(100*e.cur/e.hp)}%"></i></div><div class="sub">${DN(e.dmg[0],e.dmg[1])}</div></div>`).join('')}</div>`;
 h+='<div class="btns">';
 if(c.over){h+=B(`ניצחון. להמשיך ← ${NUM[s.cb.win]}`,()=>{if(s.cb.onWin)s.cb.onWin(c);go(s.cb.win)},'btn main')}
 else{
  h+=B(`תקיפה: ${w.n} (${DN(w.d[0],w.d[1])})`,round,'btn main');
  if(st.cls==='mu'){
   h+=B(`קליע קסם (${st.sp.missile||0})`,()=>cast('missile'),'btn','' + (st.sp.missile>0?'':'disabled'));
   const und=alive(c).some(e=>e.undead);h+=B(`שינה (${st.sp.sleep||0})`,()=>cast('sleep'),'btn',(st.sp.sleep>0&&!und?'':'disabled')+(und?' title="אינו משפיע על מתים מהלכים"':''));}
  if(s.cb.flee)h+=B('לברוח',flee,'btn');}
 h+='</div>';
 if(c.lg.length)h+=`<div class="clog">${c.lg.slice(-14).map(l=>`<div class="${l.cls}">${l.t}</div>`).join('')}</div>`;
 return h+'</div>'}
function endPanel(s){const win=s.end==='win';
 const gem=has('treasure')?900:0,tot=st.xp+st.gold+gem;
 let ttl=win?(st.fl.beat?'הניצחון על זאנזר':has('treasure')?'ירושת באראק־זול':'חופש'):'הסוף';
 let h=`<div class="endmark ${win?'win':'dead'}">${ttl}</div>`;
 if(win)h+=`<div class="panel"><div class="plabel">נק"ן</div><div class="rows"><div class="row"><span>מפלצות שהובסו</span><span>${st.xp}</span></div><div class="row"><span>זהב</span><span>${st.gold}</span></div>${gem?`<div class="row"><span>אבני חן ותכשיט</span><span>${gem}</span></div>`:''}<div class="row" style="border-top:1px solid var(--line);padding-top:4px"><span>סך הכול</span><span>${tot}</span></div></div></div>`;
 h+=`<div class="btns">${B('משחק חדש',()=>{clearSave();st=null;cr=newCr();render();window.scrollTo(0,0)},'btn main')}${!win?B('לחזור לתחילת ההרפתקה עם אותה דמות',()=>{const k={name:st.name,g:st.g,cls:st.cls,st:st.st};cr=k;startGame()},'btn'):''}</div>`;
 return h}
function sheet(){
 const c=C(),w=WEAP();
 let h=`<h2>${st.kit?esc(st.name):G('{אסיר|אסירה} ללא שם')}</h2><div class="who">${st.g==='f'?c.nf:c.n} · רמה 1</div>`;
 h+=`<div class="vitals"><div class="vit hp"><div class="v">${st.hp}<span style="font-size:13px;color:var(--muted)">/${st.max}</span></div><div class="k">נק"פ</div></div><div class="vit"><div class="v">${AC()}</div><div class="k">דרג שריון</div></div><div class="vit"><div class="v">${st.dfail}/3</div><div class="k">סף המוות</div></div></div>`;
 h+=`<div class="sblock"><div class="stats">${ABK.map(k=>`<div class="stat"><div class="k">${AB[k]}</div><div class="v">${st.st[k]}</div><div class="m">${sg(M(k))}</div></div>`).join('')}</div></div>`;
 h+=`<div class="sblock"><div class="slabel">נשק</div><div class="rows"><div class="row"><span>${w.n}</span><span>${DN(w.d[0],w.d[1])}${M('str')?' '+sg(M('str')):''}</span></div><div class="row"><span>שריון</span><span>${st.kit&&c.arm?c.arm.n:'ללא'}${st.kit&&c.shield?' ומגן':''}</span></div></div></div>`;
 if(st.cls==='mu')h+=`<div class="sblock"><div class="slabel">לחשים (עוצמה 1)</div><div class="rows"><div class="row"><span>שינה, 2ק8 קב"פ</span><span>${st.sp.sleep?'זמין':'הוטל'}</span></div><div class="row"><span>קליע קסם, ק6 ועוד 1</span><span>${st.sp.missile?'זמין':'הוטל'}</span></div></div></div>`;
 if(st.cls==='thief')h+=`<div class="sblock"><div class="slabel">כישורי גנב (כולל בונוס)</div><div class="rows">${Object.keys(TS).map(k=>`<div class="row"><span>${SK[k]}</span><span>${TS[k]}%</span></div>`).join('')}</div></div>`;
 h+=`<div class="sblock"><div class="slabel">הצלות</div><div class="rows">${Object.keys(SV).map(k=>`<div class="row"><span>${SV[k]}</span><span>${c.sv[k]}</span></div>`).join('')}</div></div>`;
 const inv=Object.keys(st.inv).filter(k=>st.inv[k]>0);const canAct=!st.done&&!st.dying;
 h+=`<div class="sblock"><div class="slabel">ציוד</div><div class="inv">${inv.length?inv.map(k=>`<div class="row"><span>${IT[k]}${st.inv[k]>1?' ×'+st.inv[k]:''}</span>${k==='potion'&&canAct&&st.hp<st.max?B('לשתות',()=>{st.inv.potion--;const n=dmgRoll([1,6],1).t,b=st.hp;st.hp=Math.min(st.max,st.hp+n);dlog(`שיקוי ריפוי: ${n}`);if(st.cmb)L(st.cmb,`שיקוי ריפוי: ${st.hp-b} נק"פ.`,'ok');else msg(`שיקוי ריפוי: ${st.hp-b} נק"פ`,'ok');fin()},'mini'):'<span></span>'}</div>`).join(''):'<div class="note">כלום. רק הכותונת.</div>'}<div class="row"><span>זהב</span><span>${st.gold} מ"ז</span></div></div></div>`;
 h+=`<div class="sblock"><div class="rows"><div class="row"><span>נק"ן מקרבות</span><span>${st.xp}</span></div></div>`;
 if(canAct&&!st.cmb&&!st.rested&&st.hp<st.max)h+=`<div class="btns">${B('מנוחה קצרה (פעם אחת): ק4',()=>{st.rested=true;const n=R(4),b=st.hp;st.hp=Math.min(st.max,st.hp+n);dlog(`מנוחה קצרה: ${n}`);msg(`מנוחה קצרה: ${st.hp-b} נק"פ`,'ok');fin()},'btn')}</div>`;
 h+=`</div><div class="sblock"><div class="slabel">יומן קוביות</div><div class="dlog">${st.dl.map(x=>`<div>${x}</div>`).join('')}</div></div>`;
 if(!st.done)h+=`<div class="sblock">${B('להתחיל מחדש',()=>{if(st._sure){clearSave();st=null;cr=newCr();render()}else{st._sure=true;render();setTimeout(()=>{if(st){st._sure=false;render()}},4000)}},'btn')}${st._sure?'<span class="note"> לחיצה נוספת מוחקת את המשחק</span>':''}</div>`;
 return h}

/* ---------- events & boot ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACTS[+b.dataset.a];if(f)f()});
document.addEventListener('input',e=>{if(e.target.id==='nm'&&cr){cr.name=e.target.value;saveCr(cr)}});
function start(){try{st=load();if(st&&!S[st.cur])st=null;cr=loadCr()||newCr();render()}catch(e){st=null;clearSave();cr=newCr();try{render()}catch(e2){document.getElementById('app').innerHTML='<p style="padding:20px">שגיאה בטעינה: '+esc(e2.message)+'</p>'}}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
</script>

</body></html>
